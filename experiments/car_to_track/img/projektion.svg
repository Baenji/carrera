<svg xmlns="http://www.w3.org/2000/svg" width="640" height="280" viewBox="0 0 640 280" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="pfeil-grau" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="pfeil-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d95926"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="640" height="280" rx="12" fill="#ffffff"/>
  <line x1="320" y1="20" x2="320" y2="262" stroke="#e0e0e0" stroke-width="1.5"/>

  <!-- ===== links: Fußpunkt liegt auf dem Abschnitt (t = 0,3) ===== -->
  <text x="20" y="34" fill="#222">Fußpunkt auf dem Abschnitt</text>

  <!-- Abschnitt als Vektor v von A nach B -->
  <line x1="50" y1="210" x2="284" y2="210" stroke="#555" stroke-width="2.5" marker-end="url(#pfeil-grau)"/>
  <text x="240" y="202" fill="#333">v</text>

  <!-- Schatten d von w auf dem Abschnitt -->
  <line x1="50" y1="210" x2="122" y2="210" stroke="#1f6fd1" stroke-width="5"/>
  <text x="86" y="202" fill="#1f4f9a" text-anchor="middle">d</text>

  <!-- Vektor w von A zur Position -->
  <line x1="50" y1="210" x2="117.1" y2="107.5" stroke="#d95926" stroke-width="2" marker-end="url(#pfeil-orange)"/>
  <text x="68" y="150" fill="#b0441a">w</text>

  <!-- Lot -->
  <line x1="122" y1="109" x2="122" y2="204" stroke="#d95926" stroke-width="1.5" stroke-dasharray="5 4"/>
  <polyline points="122,198 134,198 134,210" fill="none" stroke="#d95926" stroke-width="1.5"/>

  <circle cx="50" cy="210" r="5" fill="#222"/>
  <circle cx="290" cy="210" r="5" fill="#222"/>
  <circle cx="122" cy="210" r="6" fill="#c026d3" stroke="#6b0f75" stroke-width="1.5"/>
  <circle cx="122" cy="100" r="7" fill="#d95926"/>
  <text x="134" y="105" fill="#b0441a">Position</text>

  <g fill="#222" text-anchor="middle">
    <text x="50" y="236">A</text>
    <text x="122" y="236">Fußpunkt</text>
    <text x="290" y="236">B</text>
  </g>
  <g fill="#555" text-anchor="middle" font-size="13">
    <text x="50" y="256">t = 0</text>
    <text x="122" y="256">t = 0,3</text>
    <text x="290" y="256">t = 1</text>
  </g>

  <!-- ===== rechts: Fußpunkt läge hinter B (t = 1,4) ===== -->
  <text x="340" y="34" fill="#222">Fußpunkt außerhalb: auf B begrenzt</text>

  <!-- Verlängerung über B hinaus -->
  <line x1="530" y1="210" x2="622" y2="210" stroke="#bbb" stroke-width="2" stroke-dasharray="2 4"/>

  <!-- Abschnitt -->
  <line x1="370" y1="210" x2="524" y2="210" stroke="#555" stroke-width="2.5" marker-end="url(#pfeil-grau)"/>
  <text x="450" y="202" fill="#333">v</text>

  <!-- Lot auf die Verlängerung (zählt nicht) -->
  <line x1="594" y1="118" x2="594" y2="203" stroke="#999" stroke-width="1.5" stroke-dasharray="5 4"/>
  <circle cx="594" cy="210" r="6" fill="#ffffff" stroke="#c026d3" stroke-width="2"/>

  <!-- Abstand, der tatsächlich zählt: zu B -->
  <line x1="589.1" y1="117.6" x2="534.3" y2="203.3" stroke="#d95926" stroke-width="1.5" stroke-dasharray="5 4"/>

  <circle cx="370" cy="210" r="5" fill="#222"/>
  <circle cx="530" cy="210" r="6" fill="#c026d3" stroke="#6b0f75" stroke-width="1.5"/>
  <circle cx="594" cy="110" r="7" fill="#d95926"/>
  <text x="580" y="105" fill="#b0441a" text-anchor="end">Position</text>

  <g fill="#222" text-anchor="middle">
    <text x="370" y="236">A</text>
    <text x="530" y="236">B = Fußpunkt</text>
  </g>
  <g fill="#555" text-anchor="middle" font-size="13">
    <text x="370" y="256">t = 0</text>
    <text x="530" y="256">t = 1</text>
    <text x="594" y="256">t = 1,4</text>
  </g>
</svg>
