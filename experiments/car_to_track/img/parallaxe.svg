<svg xmlns="http://www.w3.org/2000/svg" width="640" height="390" viewBox="0 0 640 390" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="pfeil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="640" height="390" rx="12" fill="#ffffff"/>

  <!-- Kamera -->
  <rect x="100" y="22" width="40" height="26" rx="4" fill="#222"/>
  <rect x="113" y="48" width="14" height="8" fill="#222"/>
  <text x="150" y="40" fill="#222">Kamera</text>

  <!-- Senkrechte unter der Kamera -->
  <line x1="120" y1="56" x2="120" y2="300" stroke="#888" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="128" y="292" fill="#555" font-size="12">Bildmitte</text>

  <!-- Bahn -->
  <line x1="40" y1="300" x2="610" y2="300" stroke="#222" stroke-width="3"/>
  <text x="560" y="292" fill="#222">Bahn</text>

  <!-- Auto mit Punkt -->
  <rect x="330" y="250" width="100" height="50" rx="10" fill="#c9c9c9" stroke="#222" stroke-width="1.5"/>
  <circle cx="380" cy="242" r="8" fill="#1f6fd1" stroke="#0b3b7a" stroke-width="1.5"/>
  <text x="236" y="236" fill="#1f4f9a">blauer Punkt</text>

  <!-- Bahn direkt unter dem Punkt -->
  <line x1="380" y1="250" x2="380" y2="300" stroke="#1f6fd1" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="380" cy="300" r="5" fill="#1f6fd1"/>

  <!-- Sichtlinie -->
  <line x1="120" y1="56" x2="461" y2="300" stroke="#d95926" stroke-width="2.5"/>
  <circle cx="461" cy="300" r="5" fill="#d95926"/>
  <text x="300" y="150" fill="#b0441a" transform="rotate(35.6 300 150)">Sichtlinie der Kamera</text>

  <!-- Maß H -->
  <line x1="70" y1="40" x2="70" y2="298" stroke="#444" stroke-width="1.5" marker-start="url(#pfeil)" marker-end="url(#pfeil)"/>
  <text x="30" y="175" fill="#222">H</text>

  <!-- Maß h -->
  <line x1="480" y1="243" x2="480" y2="298" stroke="#444" stroke-width="1.5" marker-start="url(#pfeil)" marker-end="url(#pfeil)"/>
  <line x1="388" y1="242" x2="488" y2="242" stroke="#888" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="490" y="276" fill="#222">h</text>

  <!-- Maß X und scheinbare Entfernung -->
  <line x1="120" y1="322" x2="380" y2="322" stroke="#1f6fd1" stroke-width="1.5" marker-start="url(#pfeil)" marker-end="url(#pfeil)"/>
  <text x="200" y="316" fill="#1f4f9a">X: wo der Punkt wirklich ist</text>
  <line x1="120" y1="360" x2="461" y2="360" stroke="#d95926" stroke-width="1.5" marker-start="url(#pfeil)" marker-end="url(#pfeil)"/>
  <text x="150" y="354" fill="#b0441a">X · H / (H - h): wo die Kamera ihn sieht</text>
  <line x1="380" y1="300" x2="380" y2="330" stroke="#1f6fd1" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="461" y1="300" x2="461" y2="368" stroke="#d95926" stroke-width="1" stroke-dasharray="2 3"/>
</svg>
